name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.1' }
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  media-integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.1' }
      - name: Install FFmpeg media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: FLIXR_REQUIRE_MEDIA_INTEGRATION=1 go test -tags=media_integration ./...

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:bundle

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config
      - run: docker compose -f compose.local.yml config
      - run: docker compose -f compose.release.yml config
      - run: docker build -t flixr:ci .
      - run: bash scripts/image-smoke.sh flixr:ci
      - run: bash scripts/compose-smoke.sh flixr:ci
      - name: Scan runtime packages
        run: |
          docker save flixr:ci -o "$RUNNER_TEMP/flixr-image.tar"
          trivy_image=aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          for attempt in 1 2 3; do
            docker pull "$trivy_image" && break
            test "$attempt" = 3 && exit 1
            sleep "$attempt"
          done
          docker run --pull=never --rm --mount "type=bind,source=$RUNNER_TEMP/flixr-image.tar,target=/image.tar,readonly" \
            "$trivy_image" \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend, media-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.1', cache-dependency-path: backend/go.sum }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: Install FFmpeg acceptance dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:e2e -- --project=chromium --project=firefox --project=webkit
        working-directory: frontend
      - name: Upload mocked matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flixr-mocked-matrix-evidence
          path: frontend/test-results
          if-no-files-found: warn
      - name: Accept configured metadata through the reverse proxy
        run: |
          bash scripts/metadata-acceptance.test.sh
          bash scripts/metadata-acceptance.sh
      - name: Upload metadata acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flixr-metadata-acceptance-evidence
          path: output/playwright/metadata
          if-no-files-found: warn
      - name: Build and accept the production binary
        working-directory: backend
        run: |
          set -euo pipefail
          npm --prefix ../frontend run build:embed
          media_root="$GITHUB_WORKSPACE/backend/testdata/media"
          test -f "$media_root/films/Blue Horizon 2026.mp4"
          test -f "$media_root/films/Compatibility Check 2026.avi"
          test -f "$media_root/tv/Signal/Season 01/Signal S01E01.mkv"
          test -f "$media_root/tv/Signal/Season 01/Signal S01E02.mkv"
          go build -o ../bin/flixr .
          FLIXR_DATA_DIR="$RUNNER_TEMP/flixr-data" FLIXR_LISTEN_ADDR=127.0.0.1:8787 ../bin/flixr > "$RUNNER_TEMP/flixr.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do grep -q 'Flixr setup token:' "$RUNNER_TEMP/flixr.log" && break; sleep .1; done
          FLIXR_SETUP_TOKEN="$(sed -n 's/.*Flixr setup token: //p' "$RUNNER_TEMP/flixr.log" | head -1)"
          export FLIXR_SETUP_TOKEN
          test -n "$FLIXR_SETUP_TOKEN"
          FLIXR_ACCEPTANCE_URL=http://127.0.0.1:8787 FLIXR_SETUP_TOKEN="$FLIXR_SETUP_TOKEN" FLIXR_FILMS_ROOT="$media_root/films" FLIXR_TV_ROOT="$media_root/tv" npm --prefix ../frontend run test:e2e -- --project=chromium-production
      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flixr-production-acceptance-evidence
          path: frontend/test-results
          if-no-files-found: warn
      - name: Accept an internet-isolated media server
        run: make test-offline
      - name: Upload offline acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flixr-offline-acceptance-evidence
          path: output/playwright/offline
          if-no-files-found: warn

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:release
      - name: Check pull request title for squash merges
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-title.mjs

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mopeyjellyfish/flixr'
    needs: [backend, frontend, media-integration, docker, browser, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: flixr-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version, publish verified images, and generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLIXR_TMDB_APPLICATION_TOKEN: ${{ secrets.FLIXR_TMDB_APPLICATION_TOKEN }}
        run: |
          bash scripts/release-baseline.sh
          npm run release
