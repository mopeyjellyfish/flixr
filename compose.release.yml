name: flixr

services:
  flixr:
    image: ghcr.io/mopeyjellyfish/flixr:${FLIXR_VERSION:-latest}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${FLIXR_BIND_ADDR:-127.0.0.1}:${FLIXR_PORT:-8787}:8787"
    env_file:
      - path: ${FLIXR_ENV_FILE:-./flixr.env}
        required: false
    environment:
      FLIXR_DATA_DIR: /config
      FLIXR_SEGMENT_DIR: /cache/segments
      FLIXR_LISTEN_ADDR: 0.0.0.0:8787
    volumes:
      - flixr-data:/config
      - flixr-cache:/cache
      - type: bind
        source: ${FLIXR_MEDIA_DIR:-./media}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/api/v1/setup/status"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  flixr-data:
  flixr-cache:
